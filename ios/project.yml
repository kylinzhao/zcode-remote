name: ZCodeRemote
options:
  bundleIdPrefix: dev.zcode
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic

targets:
  ZCodeRemote:
    type: application
    platform: iOS
    sources:
      - path: ZCodeRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.zcode.remote
        MARKETING_VERSION: "1.1.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: ZCodeRemote/Info.plist
      properties:
        CFBundleDisplayName: ZCode Remote
        CFBundleShortVersionString: "1.1.1"
        CFBundleVersion: "4"
        UILaunchScreen: {}
        NSCameraUsageDescription: 需要相机权限才能扫描电脑端 ZCode 的远程访问二维码。
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false

schemes:
  ZCodeRemote:
    build:
      targets:
        ZCodeRemote: all
    run:
      config: Debug
