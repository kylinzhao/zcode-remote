name: ios-build

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen

      - name: Build (iOS Simulator)
        run: |
          cd ios
          xcodebuild -project ZCodeRemote.xcodeproj -scheme ZCodeRemote \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build

      - name: Boot iPhone simulator and smoke test
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 'iPhone' | sed -E 's/.*\(([A-F0-9-]{36})\).*/\1/')
          echo "iPhone UDID: $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" ios/build/Build/Products/Debug-iphonesimulator/ZCodeRemote.app
          mkdir -p shots
          xcrun simctl launch "$UDID" dev.zcode.remote || true
          sleep 6
          xcrun simctl io "$UDID" screenshot shots/01_iphone_empty.png || true
          # 桌面 UA 回显验证 + WebView 主链路（启动参数自动添加并打开）
          xcrun simctl launch --terminate-running-process "$UDID" dev.zcode.remote \
            -ZCODE_AUTOPEN_URL 'https://httpbin.org/user-agent' || true
          sleep 14
          xcrun simctl io "$UDID" screenshot shots/02_iphone_web.png || true

      - name: Boot iPad simulator and verify desktop-form web
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 'iPad' | sed -E 's/.*\(([A-F0-9-]{36})\).*/\1/')
          echo "iPad UDID: $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" ios/build/Build/Products/Debug-iphonesimulator/ZCodeRemote.app
          xcrun simctl launch "$UDID" dev.zcode.remote -ZCODE_AUTOPEN_URL 'https://httpbin.org/user-agent' || true
          sleep 14
          xcrun simctl io "$UDID" screenshot shots/03_ipad_desktop_ua.png || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screenshots
          path: shots/
